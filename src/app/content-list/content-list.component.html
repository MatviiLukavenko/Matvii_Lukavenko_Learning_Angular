<div class="content-list-container">
  <h2>Game List</h2>

  <ul>
    <li *ngFor="let game of gamesArray">
      <h3>{{ game.title }} ({{ game.yearReleased }})</h3>
      <p><strong>Produced By:</strong> {{ game.productionCompany | companyYear:game.yearReleased }}</p>
      <p>Genre: {{ game.genre }}</p>
      <p *ngIf="game.isActive">Status: Currently Active</p>
      <p *ngIf="!game.isActive">Status: Not Active</p>
      <p><strong>Title:</strong> <span [innerHTML]="game.title | statusColor:game.isActive"></span></p>
      <img *ngIf="game.imageUrl" [src]="game.imageUrl" alt="{{ game.title }} Cover" class="game-image" />

      <div class="button-group">
        <button (click)="editGame(game.id)">Edit</button>
        <button (click)="deleteGame(game.id)">Delete</button>
      </div>
    </li>
  </ul>

  <div *ngIf="gamesArray.length === 0" class="no-games-message">
    <p>No games found. Add some games!</p>
  </div>
</div>
